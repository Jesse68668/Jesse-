<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="每日全球简报">
  <title>每日全球简报</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <main class="container">

    <header class="hero">
      <div class="brand">DAILY GLOBAL BRIEF</div>

      <h1>每日全球简报</h1>

      <div id="dateInfo" class="date-info">
        正在读取今日简报…
      </div>
    </header>

    <section id="loading" class="status-box">
      今日简报正在加载，请稍候…
    </section>

    <section id="error" class="status-box error hidden">
      今日简报正在生成或数据暂未就绪，请稍后刷新。
    </section>

    <div id="content" class="hidden">

      <section class="headline-card">
        <div class="section-label">TODAY</div>
        <h2 id="headline"></h2>
        <p id="summary"></p>
      </section>

      <section class="section">
        <div class="section-heading">
          <div>
            <span class="section-number">01</span>
            <h2>国内外新闻</h2>
          </div>
          <span id="newsCount" class="count"></span>
        </div>

        <div id="newsList" class="cards"></div>
      </section>

      <section class="section">
        <div class="section-heading">
          <div>
            <span class="section-number">02</span>
            <h2>AI / 科技</h2>
          </div>
          <span id="techCount" class="count"></span>
        </div>

        <div id="techList" class="cards"></div>
      </section>

      <section class="section">
        <div class="section-heading">
          <div>
            <span class="section-number">03</span>
            <h2>体育赛事</h2>
          </div>
          <span id="sportsCount" class="count"></span>
        </div>

        <div id="sportsList" class="cards"></div>

        <p id="sportsNote" class="sports-note"></p>
      </section>

    </div>

    <footer>
      数据更新时间：
      <span id="generatedAt">--</span>
      · Asia/Shanghai
    </footer>

  </main>

  <script src="./app.js"></script>
</body>
</html>
